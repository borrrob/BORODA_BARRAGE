<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boroda Barrage</title>
<style>
  :root{color-scheme:dark;--panel:#11131c;--line:#34394b;--hot:#ff456c;--soft:#bfc7e6;--gold:#ffd36b}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a10;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff}
  body{display:grid;place-items:center}
  #shell{position:relative;width:min(100vw,1000px);height:min(100vh,720px);aspect-ratio:1000/720;max-height:100vh;box-shadow:0 0 60px #000;overflow:hidden;background:#05060a}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;pointer-events:none}
  .panel{pointer-events:auto;width:min(720px,94%);max-height:92%;overflow:auto;background:linear-gradient(180deg,rgba(16,18,29,.95),rgba(8,9,14,.95));border:1px solid #ffffff26;border-radius:18px;box-shadow:0 22px 70px #000c, inset 0 1px #ffffff12;padding:26px;backdrop-filter:blur(14px)}
  .title{font-size:clamp(34px,5vw,66px);font-weight:900;letter-spacing:-.045em;line-height:.92;margin:0;text-shadow:0 5px 30px #ff315a55}
  .sub{color:#cbd1e7;margin:10px 0 22px;line-height:1.45}
  .menu{display:grid;gap:9px}
  button,.btn{appearance:none;border:1px solid #ffffff22;background:#ffffff0c;color:#fff;border-radius:11px;padding:12px 14px;font-size:15px;text-align:left;cursor:pointer;transition:.15s transform,.15s background,.15s border-color}
  button:hover{transform:translateX(3px);background:#ffffff16;border-color:#ffffff44}
  button.primary{background:linear-gradient(90deg,#a31238,#e23a65);border-color:#ff6e8a66;font-weight:800}
  button.danger{border-color:#ff496955;color:#ff91a5}
  button.small{padding:8px 10px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
  .muted{color:#9da6c4;font-size:13px;line-height:1.45}.tiny{font-size:11px;color:#7f89a8}
  h2{margin:0 0 8px;font-size:25px} h3{margin:22px 0 8px;font-size:16px;color:#ffd5df}
  input,select,textarea{width:100%;background:#070910;color:#fff;border:1px solid #34394b;border-radius:10px;padding:10px 11px;font:inherit;outline:none}
  textarea{min-height:170px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.5}
  input:focus,select:focus,textarea:focus{border-color:#ff4e76}
  .scoreTable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.scoreTable th,.scoreTable td{padding:8px 6px;border-bottom:1px solid #ffffff12;text-align:left}.scoreTable th{font-size:12px;color:#9098b3;text-transform:uppercase;letter-spacing:.08em}
  .kbd{display:inline-block;min-width:27px;padding:2px 7px;border:1px solid #ffffff35;border-bottom-width:3px;border-radius:6px;background:#ffffff0d;text-align:center;font-family:ui-monospace,monospace;font-size:12px;color:#fff}
  #toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#06070cdd;border:1px solid #ffffff28;border-radius:999px;padding:9px 14px;opacity:0;transition:.2s;pointer-events:none;font-size:13px;box-shadow:0 8px 30px #0008;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .preview{height:150px;border:1px solid #ffffff1e;border-radius:12px;background:#05060b center/contain no-repeat;display:grid;place-items:center;color:#65708e;overflow:hidden}
  .stageGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.stageCard{padding:13px}.stageCard strong{display:block;margin-bottom:4px}.stageCard span{color:#929bb9;font-size:12px}
  details{border:1px solid #ffffff15;border-radius:10px;padding:10px 12px;background:#ffffff05}summary{cursor:pointer;color:#dce0f2}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}.panel{padding:18px}#ui{padding:10px}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="1000" height="720"></canvas>
  <div id="ui"></div>
  <div id="toast" class="">Добавлено 1; localStorage переполнен — сразу экспортируй</div>
</div>

<script>window.__BORODA_BUILD_JSON_PARTS__=new Array(10);</script>
<script src="boroda-data-01.js"></script>
<script src="boroda-data-02.js"></script>
<script src="boroda-data-03.js"></script>
<script src="boroda-data-04.js"></script>
<script src="boroda-data-05.js"></script>
<script src="boroda-data-06.js"></script>
<script src="boroda-data-07.js"></script>
<script src="boroda-data-08.js"></script>
<script src="boroda-data-09.js"></script>
<script src="boroda-data-10.js"></script>
<script>
'use strict';
/*
  BORODA BARRAGE — single HTML bullet-hell starter/editor.
  No external libraries, fonts, audio or network requests are required.

  QUICK ASSET REPLACEMENT IN SOURCE:
  Put a URL, relative path, or data:image/... URL into USER_ASSETS below.
  Example:
    player: 'data:image/png;base64,...'
    bg1: './my_background.png'
  Leaving a slot empty uses the built-in placeholder SVG.

  In editor mode you can replace images, menu/stage music and dialogues from the in-game menu.
  Press the export button there to bake the current project into a standalone final HTML.
*/
// BUILD is rewritten automatically when you press "Экспортировать готовую игру".
// In a final build editor=false, custom assets/music/dialogues are baked into this object.
const BUILD = JSON.parse((window.__BORODA_BUILD_JSON_PARTS__ || []).join(''));
const USER_ASSETS = BUILD.assets || {};
const USER_AUDIO = BUILD.audio || {};

const GAME_TITLE = 'BORODA BARRAGE';
const VERSION = BUILD.editor ? '2.10 editor/export' : '2.10 final';
const STORAGE = { scores:'crimsonBarrage.scores.v1', assets:'crimsonBarrage.assets.v1', dialog:'crimsonBarrage.dialog.v2_7', audio:'crimsonBarrage.audio.v1', credits:'borodaBarrage.credits.v2_7', spinText:'borodaBarrage.spinText.v1', stageComments:'borodaBarrage.stageComments.v2_7', stageDurations:'borodaBarrage.stageDurations.v1', creditsImages:'borodaBarrage.creditsImages.v2_10' };

const STAGES = [
  {
    "name": "Stage 1",
    "title": "Продуктовые сумерки",
    "boss": "Людка",
    "duration": 34,
    "bg": "bg1",
    "bossSlot": "boss1",
    "portrait": "portraitBoss1"
  },
  {
    "name": "Stage 2",
    "title": "Долг на углу",
    "boss": "Ушлый хохол",
    "duration": 35,
    "bg": "bg2",
    "bossSlot": "boss2",
    "portrait": "portraitBoss2"
  },
  {
    "name": "Stage 3",
    "title": "Двор клуба Черных Кобр",
    "boss": "Гена Мункхольм",
    "duration": 36,
    "bg": "bg3",
    "bossSlot": "boss3",
    "portrait": "portraitBoss3"
  },
  {
    "name": "Stage 4",
    "title": "Инцидент с флагом",
    "boss": "Господин Фам",
    "duration": 37,
    "bg": "bg4",
    "bossSlot": "boss4",
    "portrait": "portraitBoss4"
  }
];

const DEFAULT_DIALOGUES = BUILD.dialogues || [];

const $ = s => document.querySelector(s);
const ui = $('#ui'), canvas = $('#game'), ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, FIELD_W = 720, SIDE_X = 720;
const keys = new Set();
let pressed = new Set();
let toastTimer = 0;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1700); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}
function lerp(a,b,t){return a+(b-a)*t;}
function dist2(ax,ay,bx,by){const x=ax-bx,y=ay-by; return x*x+y*y;}
function fmtScore(n){return Math.max(0,Math.floor(n)).toString().padStart(9,'0');}
function svgData(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}

function defaultAssetMap(){
  const player = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#ff476f"/><stop offset="1" stop-color="#a8002d"/></linearGradient></defs><path d="M40 5 52 25 75 29 60 47 65 77 40 64 15 77 20 47 5 29 28 25Z" fill="url(#g)" stroke="#fff" stroke-width="3"/><circle cx="40" cy="39" r="10" fill="#ffe9d5"/><path d="M18 85 31 56h18l13 29-22-8Z" fill="#f7f3ff"/><circle cx="40" cy="55" r="3" fill="#ff234e"/></svg>`);
  const enemy1 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 42 20 60 24 47 37 50 56 32 48 14 56 17 37 4 24 22 20Z" fill="#8c78ff" stroke="#e8e2ff" stroke-width="3"/><circle cx="32" cy="31" r="7" fill="#19142b"/></svg>`);
  const enemy2 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#54d3df" stroke="#eaffff" stroke-width="3"/><path d="M9 31h46M32 9v46M16 16l32 32M48 16 16 48" stroke="#173a53" stroke-width="5"/><circle cx="32" cy="32" r="8" fill="#fff"/></svg>`);
  const enemy3 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 5 58 54H6Z" fill="#ffbe4c" stroke="#fff1bd" stroke-width="3"/><path d="M32 16 42 48H22Z" fill="#9b3b32"/></svg>`);
  const boss = (c1,c2,mark)=>svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 170"><defs><radialGradient id="a"><stop stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></radialGradient></defs><circle cx="70" cy="52" r="30" fill="#ffe9d8"/><path d="M39 52Q70 5 101 52L93 22Q70 0 47 22Z" fill="${c1}"/><path d="M31 155 46 75h48l15 80-39-18Z" fill="url(#a)" stroke="#fff" stroke-width="4"/><path d="M22 80 48 92M118 80 92 92" stroke="#fff" stroke-width="15" stroke-linecap="round"/><circle cx="58" cy="53" r="4" fill="#222"/><circle cx="82" cy="53" r="4" fill="#222"/><text x="70" y="121" text-anchor="middle" font-size="33" font-family="serif" fill="#fff">${mark}</text></svg>`);
  const portraitPlayer = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520"><rect width="400" height="520" fill="none"/><circle cx="210" cy="150" r="92" fill="#ffe8d4"/><path d="M100 165Q125 10 275 42L320 160Q265 102 100 165Z" fill="#2a243d"/><path d="M75 505 113 226h201l52 279Z" fill="#cf214c"/><path d="m160 235 45 70 47-70" fill="#fff"/><circle cx="175" cy="152" r="10"/><circle cx="245" cy="152" r="10"/><path d="M238 30 325 88 250 118Z" fill="#ff345d"/></svg>`);
  const portraitBoss = (c1,c2,mark)=>svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520"><circle cx="205" cy="150" r="92" fill="#ffe9d8"/><path d="M104 157Q132 16 302 45L314 155Q254 100 104 157Z" fill="${c1}"/><path d="M70 510 110 232h205l48 278Z" fill="${c2}"/><circle cx="170" cy="151" r="10"/><circle cx="242" cy="151" r="10"/><text x="215" y="385" text-anchor="middle" font-size="150" font-family="serif" fill="#ffffffaa">${mark}</text></svg>`);
  const bg = (a,b,c,shape)=>svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="${a}"/><stop offset=".55" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="720" height="720" fill="url(#g)"/><g opacity=".32" fill="none" stroke="#fff" stroke-width="2">${Array.from({length:10},(_,i)=>`<circle cx="${80+i*69}" cy="${100+(i%3)*180}" r="${30+(i%4)*18}"/>`).join('')}</g><g opacity=".12" fill="#fff" filter="url(#blur)"><circle cx="120" cy="140" r="90"/><circle cx="600" cy="410" r="130"/></g><text x="360" y="380" text-anchor="middle" fill="#ffffff15" font-size="210" font-family="serif">${shape}</text></svg>`);
  return {
    player, enemy1, enemy2, enemy3,
    boss1:boss('#a50e42','#ff6381','I'), boss2:boss('#4734a8','#9f90ff','II'), boss3:boss('#145b7d','#54c9e4','III'), boss4:boss('#5e247e','#cf6cea','IV'), boss5:boss('#381018','#e02049','V'),
    portraitPlayer,
    portraitBoss1:portraitBoss('#97103d','#d63358','I'), portraitBoss2:portraitBoss('#423595','#7568d5','II'), portraitBoss3:portraitBoss('#16526c','#3199b1','III'), portraitBoss4:portraitBoss('#55236e','#9a49b5','IV'), portraitBoss5:portraitBoss('#2b0d15','#a11635','V'),
    bg1:bg('#6b2332','#301a2d','#0a0d18','✦'), bg2:bg('#303063','#17214a','#080a15','❀'), bg3:bg('#1d4b57','#142936','#080b11','⌚'), bg4:bg('#45235c','#1f1b3f','#090913','☾'), bg5:bg('#6a1627','#250d18','#05060b','◆'),
    titleBg:bg('#73172f','#2b1523','#07080e','✧')
  };
}
const DEFAULT_ASSETS = defaultAssetMap();
DEFAULT_ASSETS.spinStar = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g"><stop stop-color="#fff8b0"/><stop offset=".38" stop-color="#ffd943"/><stop offset="1" stop-color="#e58916"/></radialGradient></defs><path d="M48 4 59 34 91 35 66 54 75 86 48 68 21 86 30 54 5 35 37 34Z" fill="url(#g)" stroke="#fff" stroke-width="5"/><circle cx="48" cy="48" r="10" fill="#fff5a6" opacity=".8"/></svg>`);
DEFAULT_ASSETS.bullet1 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="g"><stop stop-color="#fff"/><stop offset=".35" stop-color="#aeb2ff"/><stop offset="1" stop-color="#5d4ee8"/></radialGradient></defs><circle cx="32" cy="32" r="23" fill="url(#g)" stroke="#fff" stroke-width="5"/></svg>`);
DEFAULT_ASSETS.bullet2 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="g"><stop stop-color="#fff"/><stop offset=".3" stop-color="#ff9aaa"/><stop offset="1" stop-color="#e51f51"/></radialGradient></defs><circle cx="35" cy="31" r="21" fill="url(#g)" stroke="#fff" stroke-width="4"/><circle cx="18" cy="36" r="9" fill="#ff617c" stroke="#fff" stroke-width="3"/></svg>`);
DEFAULT_ASSETS.bullet3 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 5 58 55H6Z" fill="#52d9ff" stroke="#fff" stroke-width="5"/><path d="M32 17 43 47H21Z" fill="#187aa4" opacity=".65"/></svg>`);
DEFAULT_ASSETS.bullet4 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 80"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#fff4ad"/><stop offset=".45" stop-color="#ffd64e"/><stop offset="1" stop-color="#dc8613"/></linearGradient></defs><ellipse cx="24" cy="40" rx="14" ry="33" fill="url(#g)" stroke="#fff" stroke-width="5"/></svg>`);
DEFAULT_ASSETS.bullet5 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 76"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#ef9cff"/><stop offset="1" stop-color="#a42ed2"/></linearGradient></defs><path d="M32 4 58 38 32 72 6 38Z" fill="url(#g)" stroke="#fff" stroke-width="5"/></svg>`);
DEFAULT_ASSETS.bullet6 = svgData(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><defs><radialGradient id="g"><stop stop-color="#fff"/><stop offset=".28" stop-color="#ffe08c"/><stop offset="1" stop-color="#ff7028"/></radialGradient></defs><path d="M36 3 44 25 68 26 49 40 56 64 36 51 16 64 23 40 4 26 28 25Z" fill="url(#g)" stroke="#fff" stroke-width="5"/></svg>`);

function loadJSON(k,f){try{return JSON.parse(localStorage.getItem(k)) ?? f}catch{return f}}
function persistJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(err){console.warn('Storage write failed',err);return false}}
function cloneJSON(v){return JSON.parse(JSON.stringify(v));}

// Final builds deliberately ignore editor localStorage overrides: what was baked is what ships.
let savedAssets = BUILD.editor ? loadJSON(STORAGE.assets, {}) : {};
const imageCache = new Map();
const CREDIT_FALLBACK={credits1:'titleBg',credits2:'bg1',credits3:'bg2',credits4:'bg3',credits5:'bg4',credits6:'titleBg'};
function assetSrc(slot){
  const direct=savedAssets[slot] || USER_ASSETS[slot] || DEFAULT_ASSETS[slot] || '';
  if(direct)return direct;
  const fb=CREDIT_FALLBACK[slot];
  return fb?(savedAssets[fb]||USER_ASSETS[fb]||DEFAULT_ASSETS[fb]||''):'';
}
function img(slot){
  const src=assetSrc(slot), key=slot+'|'+src;
  if(imageCache.has(key)) return imageCache.get(key);
  const im=new Image(); im.src=src; imageCache.set(key,im); return im;
}
function imgFromSrc(src){
  const key='direct|'+src;
  if(imageCache.has(key)) return imageCache.get(key);
  const im=new Image(); im.src=src; imageCache.set(key,im); return im;
}
function setAsset(slot,src){savedAssets[slot]=src;persistJSON(STORAGE.assets,savedAssets);imageCache.clear();}
function resetAsset(slot){delete savedAssets[slot];persistJSON(STORAGE.assets,savedAssets);imageCache.clear();}

const dialogueSeed = BUILD.dialogues || DEFAULT_DIALOGUES;
let dialogues = BUILD.editor ? loadJSON(STORAGE.dialog, cloneJSON(dialogueSeed)) : cloneJSON(dialogueSeed);
function getDialogue(i){return Array.isArray(dialogues[i])&&dialogues[i].length?dialogues[i]:DEFAULT_DIALOGUES[i];}
function ensureDialogueStage(i){
  if(!Array.isArray(dialogues[i])||!dialogues[i].length)dialogues[i]=cloneJSON(DEFAULT_DIALOGUES[i]);
  return dialogues[i];
}
function dialoguePortraitSrc(stageIndex,line){
  if(line&&line.portrait)return line.portrait;
  return assetSrc(line&&line.side==='right'?STAGES[stageIndex].portrait:'portraitPlayer');
}
function setDialoguePortrait(stageIndex,lineIndex,src){
  const lines=ensureDialogueStage(stageIndex);if(!lines[lineIndex])return false;
  if(src)lines[lineIndex].portrait=src;else delete lines[lineIndex].portrait;
  imageCache.clear();return persistJSON(STORAGE.dialog,dialogues);
}

const DEFAULT_CREDITS=["BORODA BARRAGE", "Спасибо за игру!", "МУЗЫКА", "Menu - Touhou 6 - Scarlet Beyond a Crimson Dream", "Stage 1 - Touhou 6 - Cirno's Theme - Beloved Tomboyish Girl", "Stage 2 - Touhou 6 - Flandre Scarlet's Theme - U.N. Owen was her?", "Stage 3 - Devil May Cry 3 - Devils Never Cry", "Stage 4 - Fury of the Prince - Outro 2 (Reign the Conqueror_Alexander Senki) OST", "THE END"];
const creditSeed=Array.isArray(BUILD.credits)&&BUILD.credits.length?BUILD.credits:DEFAULT_CREDITS;
let credits=BUILD.editor?loadJSON(STORAGE.credits,cloneJSON(creditSeed)):cloneJSON(creditSeed);
function saveCredits(lines){credits=lines.length?lines:cloneJSON(DEFAULT_CREDITS);return persistJSON(STORAGE.credits,credits);}


// Editable duration of the ordinary-enemy section of each stage, in seconds.
const DEFAULT_STAGE_DURATIONS=STAGES.map(s=>Math.max(10,Math.round(Number(s.duration)||30)));
const stageDurationSeed=Array.isArray(BUILD.stageDurations)&&BUILD.stageDurations.length===STAGES.length?BUILD.stageDurations:DEFAULT_STAGE_DURATIONS;
let stageDurations=BUILD.editor?loadJSON(STORAGE.stageDurations,cloneJSON(stageDurationSeed)):cloneJSON(stageDurationSeed);
if(!Array.isArray(stageDurations)||stageDurations.length!==STAGES.length)stageDurations=cloneJSON(DEFAULT_STAGE_DURATIONS);
function getStageDuration(i){const v=Number(stageDurations[i]);return clamp(Number.isFinite(v)?v:DEFAULT_STAGE_DURATIONS[i],10,300);}
function saveStageDurations(values){stageDurations=STAGES.map((_,i)=>clamp(Math.round(Number(values[i])||DEFAULT_STAGE_DURATIONS[i]),10,300));return persistJSON(STORAGE.stageDurations,stageDurations);}
function resetStageDurations(){stageDurations=cloneJSON(DEFAULT_STAGE_DURATIONS);return persistJSON(STORAGE.stageDurations,stageDurations);}

// Unlimited final-credit image list. Legacy credits1..credits6 remain valid as the six default entries,
// but the list can contain any number of uploaded/URL images.
const DEFAULT_CREDIT_IMAGE_ENTRIES=Array.from({length:6},(_,i)=>({slot:'credits'+(i+1)}));
const creditsImagesSeed=Array.isArray(BUILD.creditsImages)&&BUILD.creditsImages.length?BUILD.creditsImages:DEFAULT_CREDIT_IMAGE_ENTRIES;
let creditsImages=BUILD.editor?loadJSON(STORAGE.creditsImages,cloneJSON(creditsImagesSeed)):cloneJSON(creditsImagesSeed);
if(!Array.isArray(creditsImages)||!creditsImages.length)creditsImages=cloneJSON(DEFAULT_CREDIT_IMAGE_ENTRIES);
function creditImageSrc(entry){if(typeof entry==='string')return entry;if(entry&&entry.src)return entry.src;if(entry&&entry.slot)return assetSrc(entry.slot);return assetSrc('titleBg');}
function creditImageLabel(entry,i){if(entry&&entry.slot)return `${i+1}. ${entry.slot} (базовая)`;return `${i+1}. ${(entry&&entry.name)||'добавленная картинка'}`;}
function saveCreditsImages(){return persistJSON(STORAGE.creditsImages,creditsImages);}
function resetCreditsImages(){creditsImages=cloneJSON(DEFAULT_CREDIT_IMAGE_ENTRIES);return saveCreditsImages();}

const DEFAULT_SPIN_TEXT='РАСКРУТКА';
const spinTextSeed=(typeof BUILD.spinText==='string'&&BUILD.spinText.trim())?BUILD.spinText.trim():DEFAULT_SPIN_TEXT;
let spinText=BUILD.editor?(localStorage.getItem(STORAGE.spinText)||spinTextSeed):spinTextSeed;
function saveSpinText(v){spinText=(String(v||'').trim()||DEFAULT_SPIN_TEXT).slice(0,36);try{localStorage.setItem(STORAGE.spinText,spinText);return true}catch{return false}}

const DEFAULT_STAGE_COMMENTS=[
  "Оголодал совсем, надо бы проверить тот няшный комбини в японском стиле...",

let audioDBPromise=null;
function openAudioDB(){
  if(!BUILD.editor||!('indexedDB' in window))return Promise.resolve(null);

  audioDBPromise=new Promise(resolve=>{
    try{const req=indexedDB.open(AUDIO_DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(AUDIO_STORE))db.createObjectStore(AUDIO_STORE);};
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);

}
async function idbPutAudio(k,src){const db=await openAudioDB();if(!db)return false;return new Promise(resolve=>{try{const tx=db.transaction(AUDIO_STORE,'readwrite');tx.objectStore(AUDIO_STORE).put(src,k);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);}catch{resolve(false)}});}

function getSfxCtx(){try{if(!sfxCtx)sfxCtx=new (window.AudioContext||window.webkitAudioContext)();if(sfxCtx.state==='suspended')sfxCtx.resume();return sfxCtx}catch{return null}}
function playShotSfx(){

function resetRun(){
  Object.assign(state,{score:0,lives:4,bombs:3,graze:0,power:1,frame:0,stageFrame:0,enemies:[],pBullets:[],eBullets:[],items:[],particles:[],boss:null,dialogIndex:0,transition:0,scoreSaved:false,paused:false,bgScroll:0,creditsFrame:0,creditsIndex:0,creditsPrevIndex:0,creditsSlideTimer:0,creditsFade:1,stageCommentFrame:0});
  Object.assign(state.player,{x:360,y:635,inv:120,shotCd:0,bombFx:0});
}
function startGame(diff='Normal',practice=false,stage=0){
  resetRun(); state.difficulty=diff;state.practice=practice;state.stageIndex=stage;state.mode='playing';hideUI();stageIntro();
}

function stageIntro(){state.stageSerial=(state.stageSerial||0)+1;state.stageFrame=0;state.enemies=[];state.eBullets=[];state.pBullets=[];state.items=[];state.boss=null;state.transition=160;state.stageCommentFrame=360;state.player.x=360;state.player.y=635;state.player.inv=100;playStageMusic(true);}
function nextStage(){
  if(state.practice){finishRun(true);return;}
  if(state.stageIndex>=STAGES.length-1){startCredits();return;}
  state.stageIndex++;state.mode='playing';stageIntro();
}
function startCredits(){state.mode='credits';state.creditsFrame=0;state.creditsIndex=0;state.creditsPrevIndex=0;state.creditsSlideTimer=0;state.creditsFade=1;state.enemies=[];state.eBullets=[];state.pBullets=[];state.items=[];state.boss=null;hideUI();playCreditsMusic(true);pressed.clear();}
function updateCredits(){
  state.creditsFrame++;
  state.creditsSlideTimer++;
  if(state.creditsFade<1)state.creditsFade=Math.min(1,state.creditsFade+1/72); // ~1.2 s at 60 fps
  if(state.creditsSlideTimer>=480)advanceCreditsSlide(); // ~8 s per slide
}

function finishRun(clear=false){
  state.mode=clear?'clear':'gameover';playMenuMusic(true);

  show(`<h1 class="title">${clear?'ALL CLEAR':'GAME OVER'}</h1><p class="sub">Score <b>${fmtScore(state.score)}</b> · Graze ${state.graze} · ${state.difficulty}${state.practice?' · Practice':''}</p><div class="menu"><button class="primary" id="retry">↻ Ещё раз</button><button id="scoresNow">★ Результаты</button><button id="menu">← Главное меню</button></div>`);

function saveScore(clear){

}
function togglePause(){state.paused=!state.paused;if(state.paused){pauseMusic();show(`<h2>Пауза</h2><div class="menu"><button class="primary" id="resume">Продолжить</button><button id="restart">Начать заново</button><button id="menu">В главное меню</button></div>`);$('#resume').onclick=()=>{state.paused=false;hideUI();resumeMusic()};$('#restart').onclick=()=>startGame(state.difficulty,state.practice,state.practice?state.stageIndex:0);$('#menu').onclick=mainMenu;}else{hideUI();resumeMusic();}}

function spawnEnemy(x,y,type=0,pattern=0){
  if(state.mode!=='playing')return;
  const s=state.stageIndex,d=DIFF[state.difficulty],heavy=type===2,threat=[1,1.10,1.22,1.35][s]||1.35;
  state.enemies.push({x,y,type,pattern,r:heavy?21:19,hp:(16+s*4.8)*(heavy?1.38:1)*d.hp,maxHp:1,vx:0,vy:(1.04+Math.min(type,2)*.17)*threat,age:0,fire:rand(52-s*3,86-s*4),phase:rand(0,Math.PI*2),dead:false});
}
function spawnWave(){
  const t=state.stageFrame/60,s=state.stageIndex,serial=state.stageSerial,cycle=Math.floor(t/5)%6,bonus=s>=2?1:0;
  const later=(fn,ms)=>setTimeout(()=>{if(state.mode==='playing'&&state.stageIndex===s&&state.stageSerial===serial)fn();},ms);
  if(cycle===0){const n=4+bonus;for(let i=0;i<n;i++)later(()=>spawnEnemy(110+i*(500/Math.max(1,n-1)),-34,0,0),i*(150-s*8));}
  else if(cycle===1){const n=4+(s>=3?1:0);for(let i=0;i<n;i++)later(()=>spawnEnemy(i%2?650:70,-28-i*10,1,1),i*(180-s*8));}
  else if(cycle===2){const n=3+bonus;for(let i=0;i<n;i++)later(()=>spawnEnemy(120+i*(480/Math.max(1,n-1)),-36,2,2),i*(210-s*10));}
  else if(cycle===3){const n=3+(s>=3?1:0);for(let i=0;i<n;i++)later(()=>spawnEnemy(120+i*(480/Math.max(1,n-1)),-36,3,3),i*(220-s*10));}
  else if(cycle===4){const n=3+bonus;for(let i=0;i<n;i++)later(()=>spawnEnemy(120+i*(480/Math.max(1,n-1)),-36,4,4),i*(225-s*10));}
  else {const n=4+bonus;for(let i=0;i<n;i++)later(()=>spawnEnemy(90+i*(540/Math.max(1,n-1)),-34,i%3,0),i*(160-s*8));}
}
function addEBullet(x,y,ang,speed,kind=0){
  const d=DIFF[state.difficulty],radii=[4.2,4.6,5.0,4.0,5.2,4.4]; state.eBullets.push({x,y,vx:Math.cos(ang)*speed*d.bullet,vy:Math.sin(ang)*speed*d.bullet,r:radii[kind%radii.length],kind:kind%6,grazed:false,age:0});
}
function aimed(x,y,speed,offset=0){return Math.atan2(state.player.y-y,state.player.x-x)+offset;}
function enemyFire(e){
  const s=state.stageIndex,base=[1.64,1.76,1.90,2.05][s]||2.05;
  if(e.pattern===0){
    addEBullet(e.x,e.y,aimed(e.x,e.y,base),base,0);
    if(s>=1)addEBullet(e.x,e.y,aimed(e.x,e.y,base,.10),base*.96,3);
    if(s>=3)addEBullet(e.x,e.y,aimed(e.x,e.y,base,-.10),base*.96,5);
  }else if(e.pattern===1){
    const n=[6,7,8,9][s]||9;for(let i=0;i<n;i++)addEBullet(e.x,e.y,i*Math.PI*2/n+e.age*(.015+s*.002),base*.91,i%2?1:4);
  }else if(e.pattern===2){
    const spread=[1.5,1.5,2,2][s];for(let i=-spread;i<=spread;i++)addEBullet(e.x,e.y,Math.PI/2+i*(.18-s*.008),base*1.04,(Math.round(i+spread))%2?2:3);
  }else if(e.pattern===3){
    const fan=s>=2?2:1;for(let i=-fan;i<=fan;i++)addEBullet(e.x,e.y,aimed(e.x,e.y,base,i*.12),base*.99,i===0?5:1);
  }else if(e.pattern===4){
    const fan=2+(s>=2?1:0);for(let i=-fan;i<=fan;i++)addEBullet(e.x,e.y,aimed(e.x,e.y,base,i*.072),base*1.08,i%2?4:2);
  }
}
function updateEnemies(){
  const d=DIFF[state.difficulty],s=state.stageIndex,interval=[80,72,64,57][s]||57;
  for(const e of state.enemies){
    e.age++;e.y+=e.vy;if(e.pattern===1)e.x+=Math.sin(e.age*(.025+s*.002)+e.phase)*(1.05+s*.08);if(e.pattern===4)e.x+=Math.sin(e.age*(.018+s*.0015)+e.phase)*(.75+s*.08);
    e.fire--;if(e.fire<=0&&e.y>35&&e.y<500){enemyFire(e);e.fire=Math.max(58,interval*d.fire+rand(8,22));}
    if(e.y>760)e.dead=true;
  }
  state.enemies=state.enemies.filter(e=>!e.dead);
}
function playerShoot(){

function roundRect(c,x,y,w,h,r,fill,stroke){if(w<2*r)r=w/2;if(h<2*r)r=h/2;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill)c.fill();if(stroke)c.stroke();}
function drawCredits(){
  const list=creditsImages.length?creditsImages:DEFAULT_CREDIT_IMAGE_ENTRIES,n=Math.max(1,list.length),idx=((state.creditsIndex%n)+n)%n,prev=((state.creditsPrevIndex%n)+n)%n;
  ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);
  const drawCreditBg=(entry,alpha)=>{const src=creditImageSrc(entry),im=imgFromSrc(src||assetSrc('titleBg'));if(im.complete&&im.naturalWidth&&alpha>0){ctx.save();ctx.globalAlpha=.72*alpha;const r=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*r,dh=im.naturalHeight*r;ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore();}};
  const f=clamp(state.creditsFade,0,1);
  if(prev!==idx&&f<1)drawCreditBg(list[prev],1-f);
  drawCreditBg(list[idx],prev===idx?1:f);
  ctx.fillStyle='rgba(0,0,0,.34)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillStyle='#fff';ctx.font='900 42px system-ui';ctx.fillText('BORODA BARRAGE',W/2,60);
  ctx.font='14px system-ui';ctx.fillStyle='#d9ddec';ctx.fillText(`Слайды меняются автоматически · клик — следующая · ${idx+1}/${n}`,W/2,90);
  // Credits text moves from below the screen upward. The extra travel distance creates a visible pause before the next loop.
  const gap=58,total=Math.max(gap,credits.length*gap),pauseGap=520,travel=H+total+pauseGap,offset=(state.creditsFrame*.50)%travel,start=H+90-offset;
  ctx.font='700 24px system-ui';ctx.fillStyle='#fff';credits.forEach((line,i)=>{const y=start+i*gap;if(y>-60&&y<H+70)ctx.fillText(line,W/2,y);});
  const bx=778,by=650,bw=190,bh=44;ctx.fillStyle='rgba(10,12,20,.9)';ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;roundRect(ctx,bx,by,bw,bh,10,true,true);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 15px system-ui';ctx.fillText('ЗАКОНЧИТЬ ИГРУ',bx+bw/2,by+28);ctx.restore();
}
function render(){
  if(state.mode==='credits'){drawCredits();return;}
  drawBg();drawPlayfieldFX();if(state.mode!=='menu'){drawEntities();drawBossBar();drawSidebar();drawTransition();drawStageComment();if(state.mode==='dialog')drawDialog();if(state.mode==='stageclear'){ctx.save();ctx.fillStyle='#0008';ctx.fillRect(0,0,FIELD_W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 48px system-ui';ctx.fillText('STAGE CLEAR',FIELD_W/2,330);ctx.fillStyle='#ff7891';ctx.font='18px system-ui';ctx.fillText(`Score ${fmtScore(state.score)}`,FIELD_W/2,365);ctx.restore();}}
  else{ctx.save();ctx.fillStyle='#0005';ctx.fillRect(0,0,FIELD_W,H);ctx.fillStyle='#ffffff16';for(let i=0;i<55;i++){const x=(i*137+state.frame*.8)%FIELD_W,y=(i*83+Math.sin(i)*90)%H;ctx.beginPath();ctx.arc(x,y,2+(i%4),0,Math.PI*2);ctx.fill();}ctx.restore();}
}
function loop(){updateGame();render();pressed.clear();requestAnimationFrame(loop)}

mainMenu();
hydrateAudioFromIDB().then(()=>{if(BUILD.editor&&state.mode==='menu'&&audioSrcByKey('menu'))playMenuMusic(true);});
requestAnimationFrame(loop);
</script>
